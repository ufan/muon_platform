west-commands:
  - file: scripts/west_commands/muon.py
    commands:
      - name: catalog
        class: Catalog
        help: list projects with maturity, role, groups and informs
      - name: verify
        class: Verify
        help: run each project's userdata.verify command
      - name: agents-sync
        class: AgentsSync
        help: generate agent files for all AI tools (rules, skills, adapters)
      - name: xbranch
        class: XBranch
        help: create or switch to the same topic branch across projects
      - name: legacy
        class: Legacy
        help: "managed legacy projects: list, sync (clone + read-only lock), status, build-dir"
