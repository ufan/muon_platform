# Muon platform workspace manifest (ADR-009).
#
# userdata keys (read by `west catalog`, `west verify`, `west agents-sync`):
#   role      one-line responsibility
#   maturity  legacy | support | incubating | active | stable  (ADR-009 §5)
#   deploy    edge | server | dev
#   spec      entry point for the project's specification
#   verify    plain shell command run from the project root (never calls west; ADR-009 §12)
#   informs   (legacy only) projects this legacy project is a reference for
#
# Managed legacy projects live in legacy/<dir>, are named <dir>-legacy, and are fetched and
# locked read-only with `west legacy sync` -- never with a bare `west update` (ADR-009 §15).
# Do not run `west update` on a project until it is clean and pushed (ADR-009 §11).

manifest:
  version: "1.2"

  remotes:
    - name: github
      url-base: git@github.com:ufan
    # Additional remotes are allowed for legacy and support projects only.
    - name: gitee
      url-base: git@gitee.com:chinamyworld
    - name: jw-1404
      url-base: git@github.com:jw-1404

  defaults:
    remote: github
    revision: main

  group-filter: [-legacy]

  self:
    path: platform
    west-commands: scripts/west-commands.yml

  projects:
    # ---- active / incubating -------------------------------------------
    - name: contracts
      repo-path: muon_contracts            # private on GitHub
      # contracts has no west.yml of its own yet; nothing to import (ADR-009 §13).
      path: contracts
      groups: [contracts, online, offline]
      userdata:
        role: shared wire, raw-capture, pipeline-record, service-API and state-machine contracts
        maturity: incubating
        deploy: dev
        spec: contracts/README.md

    - name: daq
      repo-path: muon_daq                  # private on GitHub
      path: daq
      revision: prototype/fx3-gen1
      # Imports daq/west.yml: daq declares its own legacy project (usb-app2-legacy).
      # The hub is blocklisted (daq lists it as a plain project); west forbids
      # `groups` together with `import`, so daq is selected by name (ADR-009 §13).
      import:
        name-blocklist: [platform]
      userdata:
        role: device control, raw stream capture, persistence and fan-out
        maturity: active
        deploy: edge
        spec: daq/SPEC.md
        verify: cmake -S . -B build/verify -DCMAKE_BUILD_TYPE=Debug && cmake --build build/verify -j && ./build/verify/muon_daq_state_machine_smoke

    # ---- support --------------------------------------------------------
    - name: config
      remote: gitee                         # to migrate to GitHub
      repo-path: muon_config
      path: config
      revision: dev
      groups: [config, online, offline]
      userdata:
        role: per-site detector configuration (mapping, alignment, z positions); future `conditions`
        maturity: support
        deploy: dev

    - name: testdata
      repo-path: muon_testdata             # private on GitHub; self-managed (README.md)
      path: testdata
      revision: main                       # tracks main: dataset changes need no hub commit
      groups: [testdata]
      west-commands: tools/west-commands.yml
      userdata:
        role: versioned test datasets (catalog + tool); bytes stay local, git-ignored (ADR-011)
        maturity: support
        deploy: dev
        spec: testdata/README.md

    - name: study
      repo-path: muon_study
      path: study
      groups: [research]
      userdata:
        role: studies and timeline
        maturity: support
        deploy: dev

    - name: muon-tools
      remote: gitee
      repo-path: muon_tools
      path: tools/muon_tools
      groups: [tools]
      userdata:
        role: small offline utilities (ADC level, rate estimate)
        maturity: support
        deploy: dev

    - name: rate-estimate
      remote: gitee
      repo-path: muon_rate_estimate
      path: tools/rate_estimate
      groups: [tools, sim]
      userdata:
        role: muon rate estimation
        maturity: support
        deploy: dev

    # ---- legacy (managed, read-only, disabled by default; ADR-009 §5, §15) ---
    # Shared legacy projects are declared here. A legacy repo used by a single
    # project is declared in that project's own west.yml (ADR-009 §13).
    - name: muon400-process-legacy
      remote: gitee
      repo-path: muon400_process
      path: legacy/muon400_process
      revision: deploy
      submodules: true                      # src/fx3
      groups: [legacy]
      userdata:
        role: legacy MUON400 chain (fx3 readout, unpack/decode, hit, track)
        maturity: legacy
        deploy: dev
        spec: platform/docs/legacy_inventory.md
        informs: [daq, preprocess, recon]

    - name: analysis-legacy
      remote: gitee
      repo-path: muon_analysis
      path: legacy/analysis
      groups: [legacy]
      userdata:
        role: legacy ROOT macros, notebooks and baseline studies
        maturity: legacy
        deploy: dev
        spec: platform/docs/legacy_inventory.md
        informs: [analysis, conditions]
