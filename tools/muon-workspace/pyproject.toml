[project]
name = "muon-workspace"
version = "0.1.0"
description = "Launcher for muon platform workspaces: finds the workspace and runs its pinned muon tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Yong Zhou" }]
keywords = ["workspace", "multi-repo", "launcher", "muography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
muon = "muon_workspace.launcher:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
