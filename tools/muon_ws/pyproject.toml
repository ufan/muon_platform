[project]
name = "muon-ws"
version = "0.1.0"
description = "Muon platform workspace tool: legacy references, agent files, catalog (ADR-009)"
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]

[project.scripts]
muon-ws = "muon_ws.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muon_ws"]
