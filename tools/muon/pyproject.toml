[project]
name = "muon-cli"
version = "0.2.0"
description = "Muon platform workspace tool (implementation; run through muon-workspace): vcs2l workspaces, legacy locks, verify, agent files"
requires-python = ">=3.9"
dependencies = ["pyyaml>=5.4", "vcs2l>=1.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.muon]
# Oldest muon-workspace that can run this implementation (release guide).
min-launcher = "0.1.0"
