# Runs this repository's verify command (.muon/repo.yml; ADR-012 §6).
name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --quiet --project tools/muon --extra test pytest -q tools/muon/tests
      - run: uv run --quiet --project tools/muon-workspace --extra test pytest -q tools/muon-workspace/tests
